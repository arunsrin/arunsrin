baseURL = 'https://www.arunsr.in/'
title = "arunsrin's notes"
locale = 'en-US'
contentDir = 'home'
publishDir = 'public'
enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]


[outputs]
  home = ['HTML', 'JSON']
  section = ['HTML']

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = true

[params]
  description = "The truth shall make ye fret."
  author = "Arun S"
  repo_name = "arunsrin"
  repo_url = "https://github.com/arunsrin/arunsrin"
  edit_url = "https://github.com/arunsrin/arunsrin/blob/master/home/"
  chess_watermark = true
  chess_corner = "top-right"

[taxonomies]
  tag = 'tags'

[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    startLevel = 2
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "github"

[[module.mounts]]
  source = 'home'
  target = 'content'

[[module.mounts]]
  source = 'home/static'
  target = 'static/static'

[[module.mounts]]
  source = 'home/css'
  target = 'static/css'

[[module.mounts]]
  source = 'static_root'
  target = 'static'
