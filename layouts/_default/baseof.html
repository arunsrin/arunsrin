<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <div class="layout-container">
    <aside class="sidebar-left">
      {{ partial "sidebar.html" . }}
    </aside>

    <main class="main-content">
      {{ block "main" . }}{{ end }}
    </main>

    <aside class="sidebar-right">
      {{ partial "toc.html" . }}
    </aside>
  </div>

  {{ partial "footer.html" . }}
</body>
</html>
