{{ define "main" }}
<article>
  {{ with .Params.tags }}
    <div style="margin-bottom: 1rem;">
      {{ range . }}
        <a href="/tags/{{ . | urlize }}/" class="tag-pill">🏷️ {{ . }}</a>
      {{ end }}
    </div>
  {{ end }}

  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
