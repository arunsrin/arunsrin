<h{{ .Level }} id="{{ .Anchor }}" class="heading-anchor-target{{ with index .Attributes "class" }} {{ . }}{{ end }}"{{ range $k, $v := .Attributes }}{{ if not (in (slice "id" "class") $k) }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>
  {{- .Text | safeHTML -}}
  {{- if gt .Level 1 -}}
    <a href="#{{ .Anchor }}" class="heading-anchor" aria-label="Link to section" title="Permanent link to this section">#</a>
  {{- end -}}
</h{{ .Level }}>
