<header class="site-header">
  <div class="brand-container">
    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation" title="Menu">
      <span>☰</span>
    </button>
    <a href="/" class="site-title">
      <span class="anim-pulse anim-flip">📝</span> {{ .Site.Title }}
    </a>
  </div>
  
  <div class="nav-controls">
    <button type="button" id="random-note-btn" class="random-btn" title="Surprise me / Random note (r)" aria-label="Surprise me / Random note (r)">
      <span class="random-icon">🎲</span>
    </button>
    <div class="search-container">
      <button type="button" id="site-search" class="search-btn" title="Search notes (/ or Ctrl+K)" aria-label="Search notes (/ or Ctrl+K)">
        <span class="search-icon">🔍</span>
      </button>
    </div>

    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
      <span id="theme-icon">🌙</span>
    </button>
  </div>
</header>
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- Command Palette / Spotlight Search Modal -->
<div id="search-modal" class="search-modal-backdrop" role="dialog" aria-modal="true" aria-label="Command Palette" style="display:none;">
  <div class="search-modal-container">
    <div class="search-modal-header">
      <span class="search-modal-icon" aria-hidden="true">🔍</span>
      <input type="text" id="modal-search-input" class="modal-search-input" placeholder="Search notes or #tag..." autocomplete="off" spellcheck="false" aria-label="Search notes or filter tags">
      <button type="button" id="search-modal-close-btn" class="search-modal-close-btn" aria-label="Close search (Esc)">ESC</button>
    </div>
    
    <div id="search-modal-results" class="search-modal-results" role="listbox" aria-label="Search results"></div>

    <div class="search-modal-footer">
      <div class="search-modal-hints">
        <span class="search-modal-hint-item"><kbd class="kbd-badge">↑</kbd><kbd class="kbd-badge">↓</kbd> Navigate</span>
        <span class="search-modal-hint-item"><kbd class="kbd-badge">↵</kbd> Select</span>
        <span class="search-modal-hint-item"><kbd class="kbd-badge">ESC</kbd> Close</span>
        <span class="search-modal-hint-item"><kbd class="kbd-badge">#</kbd> Filter tags</span>
      </div>
    </div>
  </div>
</div>

<script>
  // Theme toggle logic
  const toggleBtn = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
  }

  const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(savedTheme);

  toggleBtn.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    setTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });

  // Mobile drawer toggle logic
  document.addEventListener('DOMContentLoaded', () => {
    const menuBtn = document.getElementById('mobile-menu-btn');
    const sidebar = document.getElementById('sidebar-left');
    const overlay = document.getElementById('sidebar-overlay');
    const closeBtn = document.getElementById('sidebar-close-btn');

    function toggleSidebar(open) {
      if (!sidebar) return;
      const isOpen = open !== undefined ? open : !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', isOpen);
      if (overlay) overlay.classList.toggle('open', isOpen);
      if (menuBtn) {
        menuBtn.innerHTML = isOpen ? '✕' : '☰';
        menuBtn.setAttribute('aria-expanded', isOpen);
      }
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    if (menuBtn) {
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSidebar();
      });
    }

    if (overlay) {
      overlay.addEventListener('click', () => toggleSidebar(false));
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', () => toggleSidebar(false));
    }

    if (sidebar) {
      sidebar.addEventListener('click', (e) => {
        if (e.target.closest('a')) {
          toggleSidebar(false);
        }
      });
    }
  });

  // Command Palette / Spotlight Search Modal Logic
  let searchIndex = null;
  let tagMap = null;
  const searchTriggerBtn = document.getElementById('site-search');
  const searchModal = document.getElementById('search-modal');
  const modalSearchInput = document.getElementById('modal-search-input');
  const searchModalCloseBtn = document.getElementById('search-modal-close-btn');
  const searchModalResults = document.getElementById('search-modal-results');
  let selectedIndex = -1;

  async function loadSearchIndex() {
    if (!searchIndex) {
      try {
        const resp = await fetch('/index.json');
        searchIndex = await resp.json();
        
        // Build tag map with note counts
        tagMap = new Map();
        for (const item of searchIndex) {
          if (Array.isArray(item.tags)) {
            for (const t of item.tags) {
              const tagStr = String(t).trim();
              if (tagStr) {
                const lower = tagStr.toLowerCase();
                const existing = tagMap.get(lower);
                if (existing) {
                  existing.count++;
                } else {
                  tagMap.set(lower, { name: tagStr, count: 1 });
                }
              }
            }
          }
        }
      } catch (err) {
        console.error('Failed to load search index', err);
      }
    }
  }

  // Random Note Dice Roll Logic
  const randomNoteBtn = document.getElementById('random-note-btn');
  let isRollingRandom = false;

  const UTILITY_EXCLUDED_PATHS = new Set([
    '/',
    '/sitemap/',
    '/now/',
    '/uses/',
    '/posts/',
    '/books/',
    '/games/',
    '/tech/',
    '/other-interests/',
    '/tags/'
  ]);

  function isCandidateRandomNote(item) {
    if (!item || !item.permalink || !item.title) return false;
    let path = item.permalink.toLowerCase();
    if (!path.endsWith('/')) path += '/';
    if (UTILITY_EXCLUDED_PATHS.has(path)) return false;
    if (path.startsWith('/tags/') || path.startsWith('/posts/page/')) return false;
    return true;
  }

  async function triggerRandomNote() {
    if (isRollingRandom) return;
    isRollingRandom = true;

    if (randomNoteBtn) {
      randomNoteBtn.classList.add('rolling');
    }

    try {
      if (!searchIndex) {
        await loadSearchIndex();
      }

      if (Array.isArray(searchIndex) && searchIndex.length > 0) {
        let currentPath = window.location.pathname.toLowerCase();
        if (!currentPath.endsWith('/')) currentPath += '/';

        let candidates = searchIndex.filter(item => {
          if (!isCandidateRandomNote(item)) return false;
          let p = item.permalink.toLowerCase();
          if (!p.endsWith('/')) p += '/';
          return p !== currentPath;
        });

        if (candidates.length === 0) {
          candidates = searchIndex.filter(isCandidateRandomNote);
        }

        if (candidates.length > 0) {
          const randomIndex = Math.floor(Math.random() * candidates.length);
          const target = candidates[randomIndex];
          setTimeout(() => {
            window.location.href = target.permalink;
          }, 280);
          return;
        }
      }
    } catch (err) {
      console.error('Failed to navigate to random note', err);
    }

    setTimeout(() => {
      if (randomNoteBtn) randomNoteBtn.classList.remove('rolling');
      isRollingRandom = false;
    }, 450);
  }

  if (randomNoteBtn) {
    randomNoteBtn.addEventListener('click', triggerRandomNote);
  }

  function getCategory(permalink) {
    const p = (permalink || '').toLowerCase();
    if (p.startsWith('/tech/')) return { label: 'Tech', icon: '💻' };
    if (p.startsWith('/books/')) return { label: 'Books', icon: '📚' };
    if (p.startsWith('/games/')) return { label: 'Games', icon: '🎮' };
    if (p.startsWith('/other-interests/')) return { label: 'Research', icon: '🔬' };
    if (p.startsWith('/posts/')) return { label: 'Posts', icon: '📝' };
    if (p.startsWith('/tags/')) return { label: 'Tag', icon: '🏷️' };
    if (p === '/' || p === '') return { label: 'Home', icon: '🏠' };
    return { label: 'Note', icon: '📄' };
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlightMatches(text, query) {
    if (!text || !query) return escapeHtml(text);
    const escapedText = escapeHtml(text);
    const words = query.split(/\s+/).filter(Boolean).map(escapeRegExp);
    if (words.length === 0) return escapedText;
    const regex = new RegExp(`(${words.join('|')})`, 'gi');
    return escapedText.replace(regex, '<mark class="search-highlight">$1</mark>');
  }

  function cleanSnippet(content, query) {
    if (!content) return '';
    let text = content.replace(/:[a-z0-9_-]+:(\{[^}]+\})?/gi, '');
    text = text.replace(/^#+\s*/gm, '');
    text = text.replace(/\s+/g, ' ').trim();

    const lower = text.toLowerCase();
    const idx = lower.indexOf(query.toLowerCase());
    if (idx !== -1) {
      const start = Math.max(0, idx - 35);
      const end = Math.min(text.length, idx + query.length + 65);
      return (start > 0 ? '… ' : '') + text.substring(start, end).trim() + (end < text.length ? ' …' : '');
    }
    return text.substring(0, 95).trim() + (text.length > 95 ? ' …' : '');
  }

  function scoreItem(item, query, queryWords) {
    const title = (item.title || '').toLowerCase().trim();
    const permalink = (item.permalink || '').toLowerCase();
    const content = (item.content || '').toLowerCase();
    const tags = Array.isArray(item.tags) ? item.tags.map(t => String(t).toLowerCase()) : [];
    const slug = permalink.replace(/\/$/, '').split('/').pop() || '';

    let score = 0;

    // Exact title match (highest priority)
    if (title === query) {
      score += 1000;
    } else if (title.startsWith(query + ' ') || title.endsWith(' ' + query) || title.includes(' ' + query + ' ')) {
      score += 600;
    } else if (title.startsWith(query)) {
      score += 400;
    } else if (title.includes(query)) {
      score += 250;
    }

    // Slug match
    if (slug === query) {
      score += 350;
    } else if (slug.includes(query)) {
      score += 150;
    }

    // Tag matches
    if (tags.includes(query)) {
      score += 300;
    } else if (tags.some(t => t.includes(query))) {
      score += 100;
    }

    // Multi-word matches
    if (queryWords.length > 1) {
      let wordsInTitle = 0;
      for (const w of queryWords) {
        if (title.includes(w)) wordsInTitle++;
      }
      if (wordsInTitle === queryWords.length) {
        score += 200;
      }
    }

    // Content match
    if (content.includes(query)) {
      score += 20;
      const count = content.split(query).length - 1;
      score += Math.min(30, count * 3);
    }

    // Demote homepage
    if (permalink === '/' || permalink === '') {
      score -= 150;
    }

    return score;
  }

  function updateSelection(items) {
    items.forEach((el, idx) => {
      if (idx === selectedIndex) {
        el.classList.add('search-item-selected');
        el.setAttribute('aria-selected', 'true');
        el.scrollIntoView({ block: 'nearest' });
      } else {
        el.classList.remove('search-item-selected');
        el.setAttribute('aria-selected', 'false');
      }
    });
  }

  function renderSearchResults() {
    const rawVal = modalSearchInput.value;
    const query = rawVal.toLowerCase().trim();
    selectedIndex = -1;

    if (!searchIndex) {
      searchModalResults.innerHTML = '<div class="search-empty-state">Loading digital garden index…</div>';
      return;
    }

    // State 1: Empty input -> prompt guidance
    if (!query) {
      searchModalResults.innerHTML = `
        <div class="search-empty-state">
          <span>Type a note title, keyword, or prefix with <kbd class="kbd-badge">#</kbd> to filter tags…</span>
        </div>
      `;
      return;
    }

    // State 2: Tag Prefix Filtering (#)
    if (rawVal.startsWith('#')) {
      const tagRemainder = rawVal.slice(1).trim();
      const hasSpace = rawVal.slice(1).includes(' ');

      if (!hasSpace || !tagRemainder) {
        // Mode A: Suggesting matching tags
        const tagQuery = tagRemainder.toLowerCase();
        const matches = [];

        if (tagMap) {
          for (const [lowerTag, info] of tagMap.entries()) {
            if (!tagQuery || lowerTag.includes(tagQuery)) {
              matches.push(info);
            }
          }
        }

        // Sort: exact match / prefix matches first, then frequency
        matches.sort((a, b) => {
          const aLower = a.name.toLowerCase();
          const bLower = b.name.toLowerCase();
          const aStarts = aLower.startsWith(tagQuery);
          const bStarts = bLower.startsWith(tagQuery);
          if (aStarts && !bStarts) return -1;
          if (!aStarts && bStarts) return 1;
          return b.count - a.count;
        });

        if (matches.length === 0) {
          searchModalResults.innerHTML = `<div class="search-empty-state">No tags found matching &ldquo;#${escapeHtml(tagQuery)}&rdquo;</div>`;
          return;
        }

        searchModalResults.innerHTML = matches.slice(0, 15).map((t, idx) => {
          const safeTag = escapeHtml(t.name);
          const safeHref = '/tags/' + encodeURIComponent(t.name.toLowerCase()) + '/';
          const highlightedName = highlightMatches(t.name, tagQuery);
          return `
            <div class="search-result-item search-tag-item" role="option" data-index="${idx}" data-type="tag" data-tag="${safeTag}" data-href="${safeHref}">
              <div class="search-item-main">
                <span class="search-category-chip">🏷️ Tag</span>
                <span class="search-tag-name">#${highlightedName}</span>
                <span class="search-tag-count">${t.count} ${t.count === 1 ? 'note' : 'notes'}</span>
              </div>
              <div class="search-item-action-hint">↵ View page &nbsp;•&nbsp; Tab to filter</div>
            </div>
          `;
        }).join('');

        attachItemEvents();
        return;
      } else {
        // Mode B: Tag followed by space -> filter notes possessing that tag
        const parts = tagRemainder.split(/\s+/);
        const filterTag = parts[0].toLowerCase();
        const subQuery = parts.slice(1).join(' ').trim().toLowerCase();

        const taggedItems = searchIndex.filter(item => 
          Array.isArray(item.tags) && item.tags.some(t => String(t).toLowerCase() === filterTag)
        );

        if (taggedItems.length === 0) {
          searchModalResults.innerHTML = `<div class="search-empty-state">No notes found tagged with &ldquo;#${escapeHtml(filterTag)}&rdquo;</div>`;
          return;
        }

        let scored = [];
        if (subQuery) {
          const subWords = subQuery.split(/\s+/).filter(Boolean);
          for (const item of taggedItems) {
            const s = scoreItem(item, subQuery, subWords);
            if (s > 0) scored.push({ item, score: s });
          }
          scored.sort((a, b) => b.score - a.score);
        } else {
          scored = taggedItems.map(item => ({ item, score: 100 }));
        }

        const matches = scored.slice(0, 15).map(x => x.item);
        if (matches.length === 0) {
          searchModalResults.innerHTML = `<div class="search-empty-state">No notes tagged #${escapeHtml(filterTag)} match &ldquo;${escapeHtml(subQuery)}&rdquo;</div>`;
          return;
        }

        renderNotesList(matches, subQuery || filterTag);
        return;
      }
    }

    // State 3: Standard Full-Text Search
    const queryWords = query.split(/\s+/).filter(Boolean);
    const scored = [];

    for (const item of searchIndex) {
      const s = scoreItem(item, query, queryWords);
      if (s > 0) {
        scored.push({ item, score: s });
      }
    }

    scored.sort((a, b) => b.score - a.score);
    const matches = scored.slice(0, 12).map(x => x.item);

    if (matches.length === 0) {
      searchModalResults.innerHTML = `<div class="search-empty-state">No notes found matching &ldquo;${escapeHtml(query)}&rdquo;</div>`;
    } else {
      renderNotesList(matches, query);
    }
  }

  function renderNotesList(matches, highlightTerm) {
    searchModalResults.innerHTML = matches.map((m, idx) => {
      const cat = getCategory(m.permalink);
      const snippet = cleanSnippet(m.content, highlightTerm);
      const safeLink = encodeURI(m.permalink);
      const safeTitle = highlightMatches(m.title || m.permalink, highlightTerm);
      const safeSnippet = highlightMatches(snippet, highlightTerm);
      return `
        <div class="search-result-item" role="option" data-index="${idx}" data-href="${safeLink}">
          <div class="search-item-header">
            <span class="search-category-chip">${cat.icon} ${cat.label}</span>
            <a href="${safeLink}" class="search-item-title">${safeTitle}</a>
          </div>
          ${safeSnippet ? `<div class="search-item-snippet">${safeSnippet}</div>` : ''}
        </div>
      `;
    }).join('');

    attachItemEvents();
  }

  function attachItemEvents() {
    const items = searchModalResults.querySelectorAll('.search-result-item');
    items.forEach((itemEl, idx) => {
      itemEl.addEventListener('mouseenter', () => {
        selectedIndex = idx;
        updateSelection(items);
      });
      itemEl.addEventListener('click', (e) => {
        if (!e.target.closest('a')) {
          const href = itemEl.getAttribute('data-href');
          if (href) {
            if (e.ctrlKey || e.metaKey) {
              window.open(href, '_blank');
            } else {
              window.location.href = href;
            }
          }
        }
      });
    });
  }

  let previouslyFocusedElement = null;

  function openSearchModal(initialQuery = '') {
    previouslyFocusedElement = document.activeElement;
    searchModal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    loadSearchIndex().then(() => {
      if (initialQuery) {
        modalSearchInput.value = initialQuery;
      }
      renderSearchResults();
    });
    modalSearchInput.focus();
  }

  function closeSearchModal() {
    searchModal.style.display = 'none';
    document.body.style.overflow = '';
    modalSearchInput.value = '';
    selectedIndex = -1;
    searchModalResults.innerHTML = '';
    if (previouslyFocusedElement && typeof previouslyFocusedElement.focus === 'function') {
      previouslyFocusedElement.focus();
    }
  }

  searchTriggerBtn.addEventListener('click', () => openSearchModal());
  searchModalCloseBtn.addEventListener('click', () => closeSearchModal());
  
  searchModal.addEventListener('click', (e) => {
    if (e.target === searchModal) {
      closeSearchModal();
    }
  });

  modalSearchInput.addEventListener('input', renderSearchResults);

  modalSearchInput.addEventListener('keydown', (e) => {
    const items = searchModalResults.querySelectorAll('.search-result-item');
    if (items.length > 0) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % items.length;
        updateSelection(items);
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
        updateSelection(items);
        return;
      }
      if (e.key === 'Tab') {
        const activeItem = selectedIndex >= 0 ? items[selectedIndex] : items[0];
        if (activeItem && activeItem.getAttribute('data-type') === 'tag') {
          e.preventDefault();
          const tagName = activeItem.getAttribute('data-tag');
          modalSearchInput.value = '#' + tagName + ' ';
          renderSearchResults();
          return;
        }
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        const target = selectedIndex >= 0 && selectedIndex < items.length ? items[selectedIndex] : items[0];
        if (target) {
          const href = target.getAttribute('data-href') || target.querySelector('a')?.href;
          if (href) window.location.href = href;
        }
        return;
      }
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      closeSearchModal();
    }
  });

  // Global Keyboard Shortcuts
  document.addEventListener('keydown', (e) => {
    const isModalOpen = searchModal.style.display === 'flex';
    
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (isModalOpen) {
        closeSearchModal();
      } else {
        openSearchModal();
      }
    } else if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !isModalOpen && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
      e.preventDefault();
      openSearchModal();
    } else if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey && !isModalOpen && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName) && !document.activeElement?.isContentEditable) {
      e.preventDefault();
      triggerRandomNote();
    } else if (e.key === 'Escape' && isModalOpen) {
      e.preventDefault();
      closeSearchModal();
    }
  });
</script>
