{{ if .TableOfContents }}
  <div class="toc-container">
    <div class="toc-title">On this page</div>
    {{ .TableOfContents }}
  </div>
  <script>
    (function() {
      const tocLinks = Array.from(document.querySelectorAll('.sidebar-right nav#TableOfContents a'));
      if (!tocLinks.length) return;

      const headings = [];
      tocLinks.forEach(link => {
        const id = decodeURIComponent(link.getAttribute('href').slice(1));
        const heading = document.getElementById(id);
        if (heading) headings.push(heading);
      });

      if (!headings.length) return;

      function updateActiveToc() {
        let activeHeading = null;
        for (const heading of headings) {
          const rect = heading.getBoundingClientRect();
          if (rect.top <= 120) {
            activeHeading = heading;
          } else {
            break;
          }
        }
        if (!activeHeading) {
          activeHeading = headings[0];
        }

        tocLinks.forEach(l => l.classList.remove('active'));
        if (activeHeading) {
          const activeLink = tocLinks.find(l => {
            const h = l.getAttribute('href');
            return h === '#' + activeHeading.id || h === '#' + encodeURIComponent(activeHeading.id) || decodeURIComponent(h.slice(1)) === activeHeading.id;
          });
          if (activeLink) activeLink.classList.add('active');
        }
      }

      window.addEventListener('scroll', updateActiveToc, { passive: true });
      updateActiveToc();
    })();
  </script>
{{ end }}
