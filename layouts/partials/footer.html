<button id="back-to-top-btn" class="back-to-top-btn" aria-label="Back to top" title="Back to top">
  <span>🚀</span>
</button>

<script>
(function() {
  const QUOTE_STORAGE_KEY = 'quotes';
  const EXPIRY_STORAGE_KEY = 'quotes_expiry';
  const EXPIRY_TIME = 24 * 60 * 60 * 1000;

  let loadedQuotes = null;
  let currentQuoteIndex = -1;

  function displayRandomQuote(quotes) {
    if (!Array.isArray(quotes) || quotes.length === 0) return;
    let newIndex = Math.floor(Math.random() * quotes.length);
    if (quotes.length > 1 && newIndex === currentQuoteIndex) {
      newIndex = (newIndex + 1) % quotes.length;
    }
    currentQuoteIndex = newIndex;
    const randomQuote = quotes[newIndex];
    const quoteEl = document.getElementById('quote');
    const authorEl = document.getElementById('quote-author');
    if (quoteEl) quoteEl.textContent = `"${randomQuote.text}"`;
    if (authorEl) authorEl.textContent = randomQuote.author ? `— ${randomQuote.author}` : '';
  }

  function fetchQuotes(cb) {
    fetch('/static/quotes.json')
      .then(r => {
        if (!r.ok) throw new Error('Failed to fetch quotes');
        return r.json();
      })
      .then(data => {
        if (data && Array.isArray(data.quotes) && data.quotes.length > 0) {
          loadedQuotes = data.quotes;
          try {
            localStorage.setItem(QUOTE_STORAGE_KEY, JSON.stringify(loadedQuotes));
            localStorage.setItem(EXPIRY_STORAGE_KEY, String(Date.now() + EXPIRY_TIME));
          } catch(e) {}
          displayRandomQuote(loadedQuotes);
        }
        if (cb) cb();
      })
      .catch(err => {
        console.error('Error loading quotes:', err);
        const quoteEl = document.getElementById('quote');
        if (quoteEl && !quoteEl.textContent) {
          quoteEl.textContent = '"The woods are lovely, dark and deep, but I have promises to keep."';
          const authorEl = document.getElementById('quote-author');
          if (authorEl) authorEl.textContent = '— Robert Frost';
        }
        if (cb) cb();
      });
  }

  function rerollQuote() {
    const dice = document.querySelector('.dice-icon');
    if (dice) {
      dice.classList.add('dice-spin');
      setTimeout(() => dice.classList.remove('dice-spin'), 600);
    }
    const container = document.getElementById('quote-container');
    if (container) {
      container.style.opacity = '0.5';
    }
    setTimeout(() => {
      if (Array.isArray(loadedQuotes) && loadedQuotes.length > 0) {
        displayRandomQuote(loadedQuotes);
        if (container) container.style.opacity = '1';
      } else {
        const stored = localStorage.getItem(QUOTE_STORAGE_KEY);
        if (stored) {
          try {
            loadedQuotes = JSON.parse(stored);
          } catch(e) {
            loadedQuotes = null;
          }
        }
        if (Array.isArray(loadedQuotes) && loadedQuotes.length > 0) {
          displayRandomQuote(loadedQuotes);
          if (container) container.style.opacity = '1';
        } else {
          fetchQuotes(() => {
            if (container) container.style.opacity = '1';
          });
        }
      }
    }, 150);
  }

  window.rerollQuote = rerollQuote;

  function initQuotes() {
    const btn = document.getElementById('fortune-reroll-btn');
    if (btn) {
      btn.addEventListener('click', rerollQuote);
    }
    const expiry = localStorage.getItem(EXPIRY_STORAGE_KEY);
    const quotes = localStorage.getItem(QUOTE_STORAGE_KEY);

    if (!quotes || !expiry || Date.now() > Number(expiry)) {
      fetchQuotes();
    } else {
      try {
        loadedQuotes = JSON.parse(quotes);
        displayRandomQuote(loadedQuotes);
      } catch(e) {
        fetchQuotes();
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initQuotes);
  } else {
    initQuotes();
  }
})();
</script>

<script>
(function() {
  const EMOJI_MAP = {
    'material-home-variant': '🏡',
    'material-arrow-down-bold-circle-outline': '⬇️',
    'material-console': '💻',
    'material-brain': '🧠',
    'simple-ansible': '⚙️',
    'material-cloud': '☁️',
    'material-web': '🌐',
    'material-database': '🗄️',
    'simple-docker': '🐳',
    'material-keyboard-outline': '⌨️',
    'material-magnify': '🔍',
    'material-chart-bell-curve': '📈',
    'material-ladybug': '🐞',
    'material-kubernetes': '☸️',
    'material-penguin': '🐧',
    'material-lan': '🌐',
    'material-lock': '🔒',
    'material-code-tags': '💻',
    'simple-go': '🐹',
    'material-language-java': '☕',
    'material-powershell': '⚡',
    'material-language-python': '🐍',
    'material-fire': '🔥',
    'material-microsoft-windows': '🪟',
    'material-book': '📚',
    'material-weather-night': '🌌',
    'material-view-column': '🏛️',
    'material-library': '📖',
    'material-auto-fix': '🪄',
    'material-timer-sand': '⏳',
    'material-incognito': '🕵️',
    'material-dna': '🧬',
    'material-thought-bubble': '💭',
    'material-history': '📜',
    'material-math-compass': '📐',
    'fontawesome-solid-pen-nib': '✒️',
    'material-controller': '🎮',
    'fontawesome-brands-xbox': '🎮',
    'material-sword': '⚔️',
    'material-chip': '💾',
    'material-target': '🎯',
    'material-drama-masks': '🎭',
    'material-puzzle': '🧩',
    'material-sprout': '🪴',
    'material-television-classic': '📺',
    'material-check-circle': '✅',
    'material-earth': '🌐',
    'material-pencil': '📝',
    'material-pen-nib': '✍️',
    'material-chess-knight': '♟️',
    'material-bird': '🐦',
    'material-book-open-variant': '📖',
    'material-boxing-glove': '🥊',
    'material-calculator': '🧮',
    'material-cash-multiple': '💵',
    'material-controller-classic': '🎮',
    'material-compass-outline': '🧭',
    'material-currency-btc': '🪙',
    'material-file-document-outline': '📄',
    'material-lock-check': '🔒',
    'material-medal': '🏅',
    'material-microscope': '🔬',
    'material-skull': '💀',
    'material-television': '📺',
    'material-thermometer': '🌡️',
    'material-unicorn-variant': '🦄',
    'material-virus': '🦠'
  };

  function getIconifyName(rawName) {
    if (rawName.startsWith('material-')) return 'mdi:' + rawName.slice(9);
    if (rawName.startsWith('simple-')) return 'simple-icons:' + rawName.slice(7);
    if (rawName.startsWith('fontawesome-brands-')) return 'fa6-brands:' + rawName.slice(19);
    if (rawName.startsWith('fontawesome-solid-')) return 'fa6-solid:' + rawName.slice(18);
    if (rawName.startsWith('octicons-')) return 'octicon:' + rawName.slice(9);
    return 'mdi:' + rawName;
  }

  function transformIcons() {
    const regexWithAttrs = /:([a-z0-9_-]+):\s*\{\s*([^}]+)\s*\}/gi;
    const regexPlain = /:([a-z0-9_-]+):/gi;

    function processTextNode(node) {
      if (!node.nodeValue || !node.nodeValue.includes(':')) return;

      const text = node.nodeValue;
      if (!regexWithAttrs.test(text) && !regexPlain.test(text)) return;
      regexWithAttrs.lastIndex = 0;
      regexPlain.lastIndex = 0;

      const span = document.createElement('span');
      let html = text.replace(regexWithAttrs, (match, iconName, attrStr) => {
        const classes = attrStr.split(/\s+/).map(c => c.startsWith('.') ? c.slice(1) : c).join(' ');
        const iconifyAttr = getIconifyName(iconName);
        const fallback = EMOJI_MAP[iconName] || '🏷️';
        return `<span class="${classes}" style="display:inline-block; margin-right:0.35rem;"><iconify-icon icon="${iconifyAttr}" inline="true">${fallback}</iconify-icon></span>`;
      });

      html = html.replace(regexPlain, (match, iconName) => {
        const iconifyAttr = getIconifyName(iconName);
        const fallback = EMOJI_MAP[iconName] || '🏷️';
        return `<span style="display:inline-block; margin-right:0.35rem;"><iconify-icon icon="${iconifyAttr}" inline="true">${fallback}</iconify-icon></span>`;
      });

      span.innerHTML = html;
      node.parentNode.replaceChild(span, node);
    }

    function walkNodes(element) {
      if (!element) return;
      const childNodes = Array.from(element.childNodes);
      for (const node of childNodes) {
        if (node.nodeType === Node.TEXT_NODE) {
          processTextNode(node);
        } else if (node.nodeType === Node.ELEMENT_NODE && !['SCRIPT', 'STYLE', 'CODE', 'PRE', 'INPUT', 'TEXTAREA'].includes(node.tagName)) {
          walkNodes(node);
        }
      }
    }

    walkNodes(document.body);
    if (document.title) {
      document.title = document.title.replace(regexWithAttrs, '$1').replace(regexPlain, '$1');
    }
  }

  function transformAdmonitions() {
    const ICONS = {
      note: 'ℹ️ Note',
      tip: '💡 Tip',
      warning: '⚠️ Warning',
      caution: '🛑 Caution',
      info: 'ℹ️ Info',
      important: '❗ Important'
    };

    document.querySelectorAll('.content p, article p').forEach(p => {
      const text = p.innerHTML.trim();
      const match = text.match(/^!!!\s*([a-zA-Z]+)(?:\s+"([^"]+)")?\s*(?:<br\s*\/?>|\n)?\s*([\s\S]*)$/);
      if (match) {
        const type = match[1].toLowerCase();
        const customTitle = match[2];
        const restContent = match[3];
        const titleText = customTitle || ICONS[type] || (type.charAt(0).toUpperCase() + type.slice(1));

        const adm = document.createElement('div');
        adm.className = `admonition ${type}`;
        adm.innerHTML = `<div class="admonition-title">${titleText}</div><div class="admonition-content">${restContent}</div>`;
        p.parentNode.replaceChild(adm, p);
      }
    });
  }

  function setupCodeCopyButtons() {
    document.querySelectorAll('.content pre').forEach((pre) => {
      if (pre.closest('.mermaid') || (pre.parentElement && pre.parentElement.classList.contains('code-container'))) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'code-container';
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);

      const button = document.createElement('button');
      button.className = 'copy-code-btn';
      button.setAttribute('aria-label', 'Copy code to clipboard');
      button.title = 'Copy code';
      button.innerHTML = '📋 Copy';

      button.addEventListener('click', async () => {
        const codeElement = pre.querySelector('code');
        const textToCopy = codeElement ? codeElement.innerText : pre.innerText;
        try {
          await navigator.clipboard.writeText(textToCopy);
          button.innerHTML = '✓ Copied!';
          button.classList.add('copied');
          setTimeout(() => {
            button.innerHTML = '📋 Copy';
            button.classList.remove('copied');
          }, 2000);
        } catch (err) {
          button.innerHTML = '❌ Failed';
          setTimeout(() => {
            button.innerHTML = '📋 Copy';
          }, 2000);
        }
      });

      wrapper.appendChild(button);
    });
  }

  function setupBackToTopAndProgress() {
    const bttBtn = document.getElementById('back-to-top-btn');
    const progressBar = document.getElementById('reading-progress');

    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;

      if (bttBtn) {
        if (scrollY > 300) {
          bttBtn.classList.add('visible');
        } else {
          bttBtn.classList.remove('visible');
        }
      }

      if (progressBar && docHeight > 0) {
        const progress = (scrollY / docHeight) * 100;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
      }
    }, { passive: true });

    if (bttBtn) {
      bttBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }

  function initPage() {
    transformAdmonitions();
    transformIcons();
    setupCodeCopyButtons();
    setupBackToTopAndProgress();

    // DevTools Easter Egg
    console.log(
      "%c📜 arunsrin's notes\n%c\"If a man has reported to you, that a certain person speaks ill of you, do not make any defense to what has been told you: but reply, The man did not know the rest of my faults, for he would not have mentioned these only.\"\n%c— Epictetus",
      "color: #0284c7; font-weight: bold; font-size: 13px;",
      "font-style: italic; color: #64748b; font-size: 12px; line-height: 1.5;",
      "color: #0284c7; font-weight: 600; font-size: 11px;"
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPage);
  } else {
    initPage();
  }
})();
</script>
