name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Auto-Format Markdown Paragraphs & Commit Back (PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 scripts/fill_paragraph.py --fix
          if [ -n "$(git status --porcelain home)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add home
            git commit -m "style(prose): fill paragraphs to 70 columns [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Strict Hugo Build
        run: hugo --gc --minify --panicOnWarning

      - name: Validate JSON Indexes
        run: |
          jq . public/index.json > /dev/null
          jq . public/static/quotes.json > /dev/null

      - name: Check Internal Links & Assets
        uses: wjdp/htmltest-action@master
        with:
          config: .htmltest.yml

      - name: Run Automated Test Suites (Discovery & CI Parity)
        run: |
          for test in scripts/test_*.py; do
            echo "=== Running $test ==="
            python3 "$test"
          done
          for test in scripts/test_*.js; do
            echo "=== Running $test ==="
            node "$test"
          done


