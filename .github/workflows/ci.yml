name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Strict Hugo Build
        run: hugo --gc --minify --panicOnWarning

      - name: Validate JSON Indexes
        run: |
          jq . public/index.json > /dev/null
          jq . public/static/quotes.json > /dev/null

      - name: Check Internal Links & Assets
        uses: wjdp/htmltest-action@master
        with:
          config: .htmltest.yml

      - name: Run JavaScript & Cloudflare Anti-Pattern Tests
        run: node scripts/test_js.js

      - name: Run Related Notes & Mentions Tests
        run: python3 scripts/test_related_notes.py

      - name: Run Search Relevance & Scoring Tests
        run: node scripts/test_search.js

      - name: Run Tech Folder Animated Emojis Tests
        run: python3 scripts/test_tech_emojis.py

      - name: Run Homepage Cards Consistency Tests
        run: python3 scripts/test_homepage_cards.py

